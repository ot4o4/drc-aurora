<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Télécharger l’app Darou Rahmane Chicken</title>
<meta name="theme-color" content="#F4F4F3">
<link rel="icon" href="../assets/img/icon-192.png">
<style>
:root{--ink:#1A1A1A;--muted:#666;--red:#C8161D;--bg:#F4F4F3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}
.plate{background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 14px 30px -22px rgba(0,0,0,.6)}
.plate img{display:block;height:64px}
h1{font-size:23px;line-height:1.15;margin:8px 0 0;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:320px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #e2e2e2;border-top-color:var(--red);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.links{display:grid;gap:10px;width:100%;max-width:320px;margin-top:6px}
.links a{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:15.5px;text-decoration:none}
.links a.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px #ddd}
</style>
</head>
<body>
<main>
  <div class="plate"><img src="../assets/img/logo.png" alt="Darou Rahmane Chicken"></div>
  <h1 id="t">Ouverture de l’application…</h1>
  <p id="s">Un instant, nous préparons la bonne version pour votre téléphone.</p>
  <div class="spin" id="spin"></div>
  <div class="links">
    <a href="../iphone.html">J’ai un iPhone</a>
    <a href="../drc-android.apk" class="alt">J’ai un Android</a>
    <a href="../" class="alt">Commander sans installer</a>
  </div>
</main>
<script>
(function(){
  var ua = navigator.userAgent;
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var go = ios ? '../iphone.html?src=qr' : android ? '../drc-android.apk' : '../?src=qr';
  var t = document.getElementById('t'), s = document.getElementById('s');
  if (ios) { t.textContent = 'Installation sur iPhone'; s.textContent = 'Suivez les 3 étapes : l’icône DRC s’ajoute à votre écran d’accueil.'; }
  else if (android) { t.textContent = 'Téléchargement de l’app Android'; s.textContent = 'Ouvrez le fichier téléchargé puis touchez « Installer ». Si Android le demande, autorisez l’installation depuis votre navigateur.'; }
  setTimeout(function(){ location.replace(go); }, android ? 700 : 400);
  setTimeout(function(){ document.getElementById('spin').style.display = 'none'; }, 3000);
})();
</script>
</body>
</html>
